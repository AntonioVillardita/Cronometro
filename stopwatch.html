<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>

    <style>
        body{
            background-color: #333;
            color: whitesmoke;
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
        }

        h1{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 41px;
        }

        button{
            width: 90px;
            height: 30px;
            border-radius: 15px;
        }
    </style>

</head>
<body>

    <h1 id="display">00:00:00</h1>

    <button id="btnAvvia">AVVIA</button>

    <script>
        const display = document.getElementById('display');
        const btnAvvia = document.getElementById('btnAvvia');
        
        let tmpIniz = 0;
        let intervallo = null;

        btnAvvia.addEventListener('click', () => {
            intervallo = setInterval(() => {
                tmpIniz++;
                const ore = Math.floor(tmpIniz / 3600);
                const minuti = Math.floor((tmpIniz % 3600) / 60);
                const secondi = tmpIniz % 60;
                display.textContent = 
                `${String(ore).padStart(2, '0')}:${String(minuti).padStart(2, '0')}:${String(secondi).padStart(2, '0')}`;
            }, 1000);
        });

    </script>
    
</body>
</html>
